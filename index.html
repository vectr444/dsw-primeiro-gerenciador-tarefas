<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Card Responsivo</title>
    <!-- Tailwind CSS via Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">

    <div
        class="max-w-md mx-auto bg-white rounded-xl shadow-sm overflow-hidden md:max-w-2xl my-10 p-6 border border-slate-200">
        <div class="md:flex items-center gap-6">
            <!-- Avatar -->
            <div
                class="w-24 h-24 bg-blue-500 rounded-full flex items-center justify-center text-white text-3xl font-bold mx-auto md:mx-0 shrink-0">
                JS
            </div>

            <!-- Texto -->
            <div class="text-center md:text-left mt-4 md:mt-0">
                <div class="uppercase tracking-wide text-sm text-indigo-600 font-semibold">Desenvolvedor Front-end</div>
                <h1 class="block mt-1 text-lg leading-tight font-bold text-slate-900">João Silva</h1>
                <p class="mt-2 text-slate-500 leading-relaxed">
                    "O segredo de uma interface incrível não está nas cores, mas no domínio absoluto do espaçamento e da
                    hierarquia visual."
                </p>

                <button
                    class="mt-4 px-6 py-2 border border-slate-200 text-slate-600 font-medium rounded-lg hover:bg-slate-50 transition-colors">
                    Ver Perfil
                </button>
            </div>
        </div>
    </div>

</body>

</html>
